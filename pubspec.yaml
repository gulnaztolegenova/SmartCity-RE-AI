name: smart_city_renewable_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter


  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # Сетевые запросы к Cloud Run / FastAPI
  dio: ^5.9.0
  http: ^1.5.0

  # Состояние (удобно для асинхронных запросов/кэша)
  flutter_riverpod: ^3.2.0
  hooks_riverpod: ^3.2.0

  # Firebase (Web поддерживается из коробки)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  go_router: ^17.0.1

  # Карты + геолокация (работает и на Web)
  google_maps_flutter: ^2.12.3
  google_maps_flutter_web: ^0.5.12+2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  data_table_2: ^2.7.2
  file_picker: ^10.3.10
  mime: ^2.0.0
  uuid: ^4.5.3
  collection: ^1.19.1
  mask_text_input_formatter: ^2.9.0
  flutter_animate: ^4.5.2
  phosphor_flutter: ^2.1.0
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
